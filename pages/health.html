<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصحة والوزن — غَرْس</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/health.css">
  <script src="../js/core/theme.js"></script>
</head>
<body>
  <main class="page" id="page">
    <div class="page-head">
      <div>
        <h1 class="page-head__title">الصحة والطعام والوزن</h1>
        <p class="page-head__desc">الماء، المشي، الرياضة، الطعام، النوم… أضف ما تريد من المهام الصحية وتابع وزنك.</p>
      </div>
    </div>

    <div class="grid-main-side">
      <section class="card">
        <div class="card__head">
          <h2 class="card__title"><span class="tile tile--sm tile--sage" data-icon="scale"></span>الوزن</h2>
          <span class="card__subtitle" id="weight-sub"></span>
        </div>
        <div class="grid-3 mb-4" id="weight-kpis"></div>
        <div id="weight-chart"></div>
      </section>

      <section class="card">
        <div class="card__head"><h2 class="card__title"><span class="tile tile--sm tile--leaf" data-icon="plus"></span>تسجيل وزن</h2></div>
        <form class="form" id="weight-form" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="w-value">الوزن (كغ)</label>
              <input id="w-value" class="input" type="number" name="weight" step="0.1" min="20" max="400" required inputmode="decimal">
            </div>
            <div class="field">
              <label for="w-date">التاريخ</label>
              <input id="w-date" class="input" type="date" name="date">
            </div>
          </div>
          <div class="field">
            <label for="w-notes">ملاحظات</label>
            <input id="w-notes" class="input" name="notes" maxlength="120" placeholder="اختياري">
          </div>
          <div class="field-error" data-error role="alert"></div>
          <button class="btn btn--block" type="submit">حفظ</button>
        </form>
        <div class="weight-history" id="weight-history"></div>
      </section>
    </div>

    <div class="grid-2 mt-6">
      <section class="card">
        <div class="card__head">
          <h2 class="card__title"><span class="tile tile--sm tile--rose" data-icon="heartPulse"></span>مهام الصحة اليوم</h2>
          <span class="card__subtitle" id="health-pct"></span>
        </div>
        <div id="health-today"></div>
      </section>
      <section class="card">
        <div class="card__head">
          <div>
            <h2 class="card__title"><span class="tile tile--sm tile--gold" data-icon="zap"></span>إضافة سريعة</h2>
            <p class="card__subtitle">قوالب صحية جاهزة</p>
          </div>
        </div>
        <div id="presets"></div>
      </section>
    </div>
  </main>

  <script src="../js/loader.js" data-page="health"></script>
</body>
</html>
