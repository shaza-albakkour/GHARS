<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الإحصائيات — غَرْس</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/stats.css">
  <script src="../js/core/theme.js"></script>
</head>
<body>
  <main class="page" id="page">
    <div class="page-head">
      <div>
        <h1 class="page-head__title">الإحصائيات</h1>
        <p class="page-head__desc">تُحسب النسب من المهام التي ضغطتَ عليها "تم الإنجاز" فقط — وليس من إيقاف المنبّهات.</p>
      </div>
      <div class="segmented" id="range" role="group" aria-label="الفترة">
        <button data-range="week">الأسبوع</button>
        <button data-range="month" class="is-active">الشهر</button>
        <button data-range="year">السنة</button>
      </div>
    </div>

    <section class="grid-4" id="kpis" aria-label="أرقام رئيسية"></section>

    <section class="card mt-6">
      <div class="card__head">
        <div>
          <h2 class="card__title" id="chart-title">التقدم</h2>
          <p class="card__subtitle" id="chart-sub"></p>
        </div>
        <button class="btn btn--ghost btn--sm" data-table-toggle aria-pressed="false">عرض كجدول</button>
      </div>
      <div id="main-chart"></div>
      <div id="main-table" hidden></div>
    </section>

    <div class="grid-2 mt-6">
      <section class="card">
        <div class="card__head"><h2 class="card__title"><span class="tile tile--sm tile--sky" data-icon="tag"></span>حسب التصنيف</h2><span class="card__subtitle" id="cat-sub"></span></div>
        <div id="by-category"></div>
      </section>
      <section class="card">
        <div class="card__head"><h2 class="card__title"><span class="tile tile--sm tile--gold" data-icon="trophy"></span>الأفضل</h2></div>
        <div class="best-list" id="best"></div>
      </section>
    </div>

    <div class="grid-2 mt-6">
      <section class="card">
        <div class="card__head"><h2 class="card__title"><span class="tile tile--sm tile--sky" data-icon="calendar"></span>تطور الأداء عبر السنوات</h2></div>
        <div id="years-chart"></div>
      </section>
      <section class="card">
        <div class="card__head"><h2 class="card__title"><span class="tile tile--sm tile--sage" data-icon="scale"></span>تطور الوزن</h2><a class="link-btn" href="health.html">سجل الوزن</a></div>
        <div id="weight-chart"></div>
      </section>
    </div>
  </main>

  <script src="../js/loader.js" data-page="stats"></script>
</body>
</html>
